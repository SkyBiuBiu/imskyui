name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 版本号散落多处时手工同步极易漏改，此项强制 package.json / version.ts /
      # CHANGELOG / README 四者一致，并禁止源码出现硬编码版本号
      - name: 版本一致性
        run: pnpm check:version

      - name: 生产构建
        run: pnpm build

      # routeTree.gen.ts 由构建生成（已 gitignore），类型检查需在构建之后
      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test
